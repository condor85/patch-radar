# Solo se usi la riga di comando (npx wrangler deploy). Da pannello web non serve.
name = "patch-radar-admin"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
REPO = "condor85/patch-radar"
ALLOWED_ORIGIN = "https://condor85.github.io"

# Il blocco di chi sbaglia la password usa già l'archivio TEAM qui sotto: il KV «RL» non serve.
# Resta supportato solo come ripiego per un ponte senza TEAM: crea un KV chiamato «RL» e togli il commento.
# [[kv_namespaces]]
# binding = "RL"
# id = "<id dell'archivio KV>"

# Archivio privato della squadra («Ci gioco» / «Mi interessa»). Funziona anche con il piano gratuito.
[[durable_objects.bindings]]
name = "TEAM"
class_name = "Team"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Team"]
