name: Aggiorna patch

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**", "README.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: patch-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # un'esecuzione bloccata (es. Gemini che non risponde) non deve accodare tutte le successive
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Scarica gli annunci da Steam
        id: fetch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 scripts/fetch_news.py

      - name: Salva i dati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub spegne i controlli programmati dopo 60 giorni senza attività: se l'ultimo commit ha più di 25 giorni ne facciamo uno
          LAST=$(git log -1 --format=%ct); NOW=$(date +%s)
          if [ $((NOW - LAST)) -gt 2160000 ]; then date -u +"%Y-%m-%dT%H:%M:%SZ" > data/keepalive.txt; fi
          git add data/news.json data/keepalive.txt 2>/dev/null || git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna annunci Steam"
            git push || (git pull --rebase -X theirs origin main && git push)
          fi

      - name: Prepara il sito
        if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js qr.js config.json icons data _site/

      - uses: actions/configure-pages@v5
        if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v4
        if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
