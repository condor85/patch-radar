name: Aggiorna patch

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**", "README.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: patch-radar
  cancel-in-progress: false

jobs:
  # Sulle modifiche al codice (push su main) i test passano prima della pubblicazione; se falliscono il sito non cambia.
  # Nei controlli programmati e a mano il test è saltato, così un test rotto non ferma l'arrivo delle nuove patch.
  test:
    if: github.event_name == 'push'
    uses: ./.github/workflows/tests.yml

  update:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30   # un'esecuzione bloccata (es. Gemini che non risponde) non deve accodare tutte le successive
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Scarica gli annunci da Steam
        id: fetch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 scripts/fetch_news.py

      - name: Salva i dati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub spegne i controlli programmati dopo 60 giorni senza attività: se l'ultimo commit ha più di 25 giorni ne facciamo uno
          LAST=$(git log -1 --format=%ct); NOW=$(date +%s)
          if [ $((NOW - LAST)) -gt 2160000 ]; then date -u +"%Y-%m-%dT%H:%M:%SZ" > data/keepalive.txt; fi
          git add -A data   # news.json, players.json ed eventuale keepalive.txt
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna annunci Steam"
            git push || (git pull --rebase -X theirs origin main && git push)
          fi

      # Le notifiche partono solo QUI, dopo che i dati sono stati salvati: se il salvataggio fallisce questo passo
      # non viene eseguito e la volta dopo gli stessi annunci risultano ancora nuovi (niente notifiche doppie).
      - name: Invia le notifiche
        if: steps.fetch.outputs.changed == 'true'
        continue-on-error: true   # un problema di ntfy non deve bloccare la pubblicazione del sito
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SIGN_KEY: ${{ secrets.NTFY_SIGN_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 scripts/fetch_news.py --send

      - name: Prepara il sito
        if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js qr.js shared.js config.json icons js data _site/

      # Calcola la versione dell'app dal contenuto dei file e la scrive in tutti i punti insieme (APP_VERSION, ?v= degli script,
      # nome della cache del service worker) solo nella copia pubblicata. Se non va a buon fine il sito esce con la versione dei sorgenti.
      - name: Versione dell'app
        if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
        continue-on-error: true
        run: python3 scripts/stamp_version.py _site

      # Se in config.json c'è l'indirizzo del ponte di amministrazione ("adminApi"), lo aggiunge alla Content-Security-Policy
      # del sito pubblicato (solo un'origine https valida). Se non va a buon fine il sito esce comunque, col ponte non raggiungibile.
      - name: Abilita il ponte di amministrazione
        if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
        continue-on-error: true
        run: python3 scripts/csp_admin.py config.json _site/index.html

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: _site
      # Ogni tanto GitHub risponde "No artifacts named github-pages were found" subito dopo il caricamento (ritardo lato GitHub):
      # il primo tentativo può fallire senza colpa nostra, quindi si aspetta un poco e si riprova una volta sola.
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
        continue-on-error: true
      - name: Attendi prima di riprovare la pubblicazione
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        name: Riprova la pubblicazione
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: steps.deployment.outcome == 'failure'

  # Se l'aggiornamento fallisce due volte di fila apre una segnalazione sul repository (GitHub avvisa il proprietario per email);
  # alla prima esecuzione riuscita la chiude. Permessi minimi, solo qui: non tocca il codice né i dati.
  stato:
    needs: update
    if: ${{ always() && (needs.update.result == 'failure' || needs.update.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - name: Avvisa o chiudi la segnalazione
        continue-on-error: true   # un problema qui non deve far apparire fallito l'aggiornamento
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.update.result }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/alert_failures.py
