name: Test

# Lancia tutti i test su ogni modifica del codice (branch e pull request).
# Il workflow «Aggiorna patch» riusa questo file prima di pubblicare, così un errore non va online.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false   # i test non scrivono sul repository: il token non resta nella cartella
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Analisi statica (Python)
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet "ruff==0.16.9"
          "$RUNNER_TEMP/lint/bin/ruff" check scripts tests
      - name: Script di aggiornamento (Python)
        run: python3 -m unittest discover -s tests -v
      - name: Service worker
        run: node tests/sw.test.js
      - name: Ponte di amministrazione
        run: node tests/worker.test.mjs
      - name: Ritmo delle patch
        run: node tests/cadence.test.js
      - name: Sincronizzazione
        run: node tests/sync-client.test.mjs
      - name: Condivisione da Steam
        run: node tests/share.test.js
      - name: Elenco giochi
        run: node tests/core.test.js
      - name: Struttura dell'app
        run: node tests/structure.test.js
